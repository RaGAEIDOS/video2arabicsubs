# ─────────────────────────────────────────────────────────────────────────────
# Release pipeline for Video2ArabicSubs
#
#   test          → unit + smoke tests (Linux, CPU torch)
#   build-linux   → dist/v2as_<v>_amd64.deb + dist/v2as-<v>-linux-x86_64.run
#                   + the apt repository tree (pool/dists for gh-pages)
#   build-windows → dist/Video2ArabicSubs-Setup-<v>.exe (PyInstaller + NSIS)
#   publish-apt   → pushes the apt tree to the gh-pages branch (site root)
#   release       → attaches every artifact to the GitHub Release (tags only)
#
# One-time repo setup for `sudo apt install v2as` from gh-pages:
#   Settings → Pages → Source: "Deploy from a branch" → branch: gh-pages
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies (CPU torch first — much smaller)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Feature tests (v0.4 macros)
        run: python tests/features_test.py

      - name: Smoke tests (pipeline + web + desktop shim)
        run: python tests/smoke_test.py

  build-linux:
    name: Build .deb + .run + apt repo
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the Debian package
        run: ./scripts/build-deb.sh

      - name: Build the self-extracting installer
        run: ./scripts/build-run.sh

      - name: Assemble the apt repository
        run: ./scripts/build-apt-repo.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: run-installer
          path: dist/*.run
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: build/apt-repo
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Generate installer icon from the logo
        shell: pwsh
        run: |
          if (Get-Command magick -ErrorAction SilentlyContinue) {
            magick img/first-logo-design.png -resize 256x256 img/app.ico
          } elseif (Get-Command convert -ErrorAction SilentlyContinue) {
            convert img/first-logo-design.png -resize 256x256 img/app.ico
          } else {
            Write-Host "ImageMagick not available - installer will use the default NSIS icon"
          }

      - name: Build executable (PyInstaller, onedir)
        run: pyinstaller --clean video2arabicsubs.spec

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          # choco installs NSIS machine-wide, but the runner's environment
          # (and each step's shell) was fixed at startup — refresh PATH so
          # makensis resolves, with a full-path fallback just in case.
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path","User")
          $makensis = $null
          $cmd = Get-Command makensis -ErrorAction SilentlyContinue
          if ($cmd) { $makensis = $cmd.Source }
          if (-not $makensis) {
            foreach ($p in @("${env:ProgramFiles(x86)}\NSIS\makensis.exe",
                             "$env:ProgramFiles\NSIS\makensis.exe")) {
              if (Test-Path $p) { $makensis = $p; break }
            }
          }
          if (-not $makensis) { throw "makensis not found — the NSIS install step failed" }
          # Pass the generated icon when it exists (NSIS has no !ifexist — the
          # script guards it with !ifdef APP_ICON and keeps the default icon
          # when the define is absent).
          $nsisArgs = @()
          if (Test-Path img\app.ico) { $nsisArgs += "/DAPP_ICON=img\app.ico" }
          & $makensis @nsisArgs installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  publish-apt:
    name: Publish apt repo to gh-pages
    runs-on: ubuntu-latest
    needs: build-linux
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apt-repo
          path: apt-repo

      - name: Show repository tree
        run: find apt-repo -type f | sort

      - name: Deploy to gh-pages (site root = apt repository)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          enable_jekyll: false
          force_orphan: true

  release:
    name: GitHub Release (tags only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp artifacts/*.deb release-assets/ 2>/dev/null || true
          cp artifacts/*.run release-assets/ 2>/dev/null || true
          cp artifacts/*.exe release-assets/ 2>/dev/null || true
          ls -la release-assets

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 🎬 Video2ArabicSubs v0.4

            تحويل أي فيديو إلى **ترجمة عربية (SRT/VTT)** — محلياً وبدون إنترنت افتراضياً، بواجهة عصرية ثنائية اللغة (عربي / English) **لا تعلّق أبداً**.

            <p align="center">
              <img src="https://raw.githubusercontent.com/RaGAEIDOS/video2arabicsubs/main/screenshots/desktop-ar.png" width="420"/>
              &nbsp;&nbsp;
              <img src="https://raw.githubusercontent.com/RaGAEIDOS/video2arabicsubs/main/screenshots/desktop-en.png" width="420"/>
            </p>

            ### ✨ أبرز ما الجديد

            - 🎨 **واجهة سطح مكتب عصرية بالكامل** — بطاقات دائرية الحواف، شريط مراحل، أنيميشن ناعم، ثنائية اللغة مع انعكاس فوري RTL/LTR — والمعالجة كلها في خيط خلفي ف**لا تتجمّد الواجهة أبداً**.
            - 🔤 **حروف عربية متصلة** على لينكس (تشكيل مسبق يعالج نقص HarfBuzz في Tk 8.6) — ويندوز وماك يعرضان بشكلها الأصلي.
            - 🧠 **الترجمة أولاً بدون إنترنت** — محرك `argos` المحلي افتراضياً، وترجمة جوجل خيار صريح مع سقوط تلقائي عند القيود.
            - 📁 **حفظ الترجمة بجانب الفيديو** مباشرة (أو مجلد مخصص) + **ترجمة مجلد كامل بالترتيب الطبيعي** (`ep2` قبل `ep10`) مع إعادة ترتيب ▲▼.
            - 🎞️ **صيغة تختارها**: `SRT` / `VTT` / الاثنين · **حرق اختياري** للترجمة داخل الفيديو · **سطر ترويج** قابل للإيقاف في النهاية.
            - 📦 **حزم جاهزة لكل المنصات** + **مستودع apt رسمي**: `sudo apt install v2as`.

            ### ⬇️ التثبيت

            | المنصة | الحزمة | الأمر |
            |---|---|---|
            | 🐧 Debian / Ubuntu | المستودع الرسمي | `sudo apt install v2as` (أدناه) |
            | 🐧 Debian / Ubuntu | `v2as_0.4_amd64.deb` | `sudo apt install ./v2as_0.4_amd64.deb` |
            | 🐧 لينكس محمول | `v2as-0.4-linux-x86_64.run` | `chmod +x *.run && ./v2as-0.4-linux-x86_64.run` |
            | 🪟 ويندوز | `Video2ArabicSubs-Setup-0.4.exe` | شغّل المُثبِّت |

            ```bash
            echo "deb [trusted=yes] https://ragaeidos.website/video2arabicsubs/ stable main" \
              | sudo tee /etc/apt/sources.list.d/v2as.list
            sudo apt update
            sudo apt install v2as
            ```

            > بعد التثبيت: `v2as` (واجهة سطح المكتب) · `v2as --web` (تطبيق ويب على `127.0.0.1:7676`) · `v2as --lang en`.
            > الحزمة خفيفة (~1.1MB) — المكتبات تُثبَّت تلقائياً عند أول تشغيل في `~/.cache/v2as/venv`.

            ### 🧪 الجودة

            اختبارات المزايا **42/42** + اختبار شامل E2E (خط الإنتاج + الويب + سطح المكتب) — كلها تعمل بدون إنترنت وبدون نماذج ML.
