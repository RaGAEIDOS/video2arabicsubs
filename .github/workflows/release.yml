# ─────────────────────────────────────────────────────────────────────────────
# Release pipeline for Video2ArabicSubs
#
#   test          → unit + smoke tests (Linux, CPU torch)
#   build-linux   → dist/v2as_<v>_amd64.deb + dist/v2as-<v>-linux-x86_64.run
#                   + the apt repository tree (pool/dists for gh-pages)
#   build-windows → dist/Video2ArabicSubs-Setup-<v>.exe (PyInstaller + NSIS)
#   publish-apt   → pushes the apt tree to the gh-pages branch (site root)
#   release       → attaches every artifact to the GitHub Release (tags only)
#
# One-time repo setup for `sudo apt install v2as` from gh-pages:
#   Settings → Pages → Source: "Deploy from a branch" → branch: gh-pages
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies (CPU torch first — much smaller)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Feature tests (v0.4 macros)
        run: python tests/features_test.py

      - name: Smoke tests (pipeline + web + desktop shim)
        run: python tests/smoke_test.py

  build-linux:
    name: Build .deb + .run + apt repo
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the Debian package
        run: ./scripts/build-deb.sh

      - name: Build the self-extracting installer
        run: ./scripts/build-run.sh

      - name: Assemble the apt repository
        run: ./scripts/build-apt-repo.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: run-installer
          path: dist/*.run
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: build/apt-repo
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Generate installer icon from the logo
        shell: pwsh
        run: |
          if (Get-Command magick -ErrorAction SilentlyContinue) {
            magick img/first-logo-design.png -resize 256x256 img/app.ico
          } elseif (Get-Command convert -ErrorAction SilentlyContinue) {
            convert img/first-logo-design.png -resize 256x256 img/app.ico
          } else {
            Write-Host "ImageMagick not available - installer will use the default NSIS icon"
          }

      - name: Build executable (PyInstaller, onedir)
        run: pyinstaller --clean video2arabicsubs.spec

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: Build installer (NSIS)
        run: makensis installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  publish-apt:
    name: Publish apt repo to gh-pages
    runs-on: ubuntu-latest
    needs: build-linux
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apt-repo
          path: apt-repo

      - name: Show repository tree
        run: find apt-repo -type f | sort

      - name: Deploy to gh-pages (site root = apt repository)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          enable_jekyll: false
          force_orphan: true

  release:
    name: GitHub Release (tags only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp artifacts/*.deb release-assets/ 2>/dev/null || true
          cp artifacts/*.run release-assets/ 2>/dev/null || true
          cp artifacts/*.exe release-assets/ 2>/dev/null || true
          ls -la release-assets

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## ⬇️ Quick install

            | Platform | Package | Install |
            |---|---|---|
            | Debian/Ubuntu (apt) | repo on `gh-pages` | `sudo apt install v2as` (see README) |
            | Debian/Ubuntu (manual) | `v2as_*_amd64.deb` | `sudo apt install ./v2as_*_amd64.deb` |
            | Linux (portable) | `v2as-*-linux-*.run` | `chmod +x *.run && ./v2as-*-linux-*.run` |
            | Windows | `Video2ArabicSubs-Setup-*.exe` | run the installer |

            Arabic subtitles (SRT / VTT) from any video — offline local
            translation by default, bilingual desktop + web UI.
